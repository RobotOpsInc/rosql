<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" aria-label="Google BigQuery">
  <!-- BigQuery magnifying glass / prism icon -->
  <!-- Outer hexagon-ish shape in Google blue -->
  <path d="M30 4 L52 17 L52 43 L30 56 L8 43 L8 17 Z" fill="#4285F4"/>
  <!-- Inner white shape / lens -->
  <circle cx="28" cy="27" r="12" fill="none" stroke="#fff" stroke-width="5"/>
  <!-- Magnifying glass handle -->
  <line x1="36" y1="36" x2="47" y2="47" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- BQ letter hint -->
  <text x="21" y="32" font-family="Arial" font-weight="800" font-size="11" fill="#fff">BQ</text>
</svg>
