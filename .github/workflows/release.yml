name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check CHANGELOG has entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "\[$VERSION\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md has no entry for version $VERSION"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 > /tmp/release-notes.md

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "ROSQL ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --draft

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target (Intel Mac)
        if: matrix.cross_target != ''
        run: rustup target add ${{ matrix.cross_target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build
        run: cargo build --release --features server,duckdb --bin rosql ${{ matrix.cross_target != '' && format('--target {0}', matrix.cross_target) || '' }}

      - name: Install cargo-about
        run: cargo install cargo-about --locked

      - name: Generate third-party notices
        run: cargo about generate about.hbs > THIRD_PARTY_NOTICES

      - name: Package
        run: |
          mkdir -p staging
          BIN_DIR=${{ matrix.cross_target != '' && format('target/{0}/release', matrix.cross_target) || 'target/release' }}
          cp "$BIN_DIR/rosql" staging/
          cp NOTICE LICENSE THIRD_PARTY_NOTICES staging/
          tar czf rosql-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz \
            -C staging .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            rosql-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz

  finalize-release:
    name: Publish Release
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --repo RobotOpsInc/rosql \
            --draft=false

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [create-release, finalize-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release download "$TAG" \
            --repo RobotOpsInc/rosql \
            --pattern "rosql-${VERSION}-aarch64-apple-darwin.tar.gz" \
            --pattern "rosql-${VERSION}-x86_64-apple-darwin.tar.gz"

      - name: Compute SHA256 checksums
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARM_SHA=$(sha256sum "rosql-${VERSION}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          INTEL_SHA=$(sha256sum "rosql-${VERSION}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          echo "ARM_SHA=$ARM_SHA" >> "$GITHUB_ENV"
          echo "INTEL_SHA=$INTEL_SHA" >> "$GITHUB_ENV"

      - name: Clone homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/RobotOpsInc/homebrew-tap.git" tap

      - name: Update formula
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          FORMULA="tap/Formula/rosql.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"

          # Update ARM SHA256 (line after the aarch64 url)
          sed -i "/aarch64-apple-darwin/,/sha256/{s/sha256 \".*\"/sha256 \"${ARM_SHA}\"/}" "$FORMULA"

          # Update Intel SHA256 (line after the x86_64 url)
          sed -i "/x86_64-apple-darwin/,/sha256/{s/sha256 \".*\"/sha256 \"${INTEL_SHA}\"/}" "$FORMULA"

      - name: Open PR on homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          BRANCH="bump-rosql-${VERSION}"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/rosql.rb
          git commit -m "rosql ${VERSION}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --repo RobotOpsInc/homebrew-tap \
            --title "rosql ${VERSION}" \
            --body "Automated formula bump for rosql ${VERSION}." \
            --base main \
            --head "$BRANCH")

          gh pr merge "$PR_URL" \
            --repo RobotOpsInc/homebrew-tap \
            --merge

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Authenticate with crates.io (OIDC trusted publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --no-verify --allow-dirty

  upload-demo-data:
    name: Upload demo dataset to S3
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::189676910689:role/github-actions-deploy-production
          aws-region: us-east-1

      - name: Upload Parquet fixtures
        run: |
          aws s3 sync examples/parquet/fixtures/ \
            s3://robotops-production-rosql-demo/data/ \
            --delete \
            --no-progress

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM package
        run: wasm-pack build --target web --release --scope robotops -- --features wasm

      - name: Publish with provenance (OIDC trusted publishing)
        working-directory: pkg
        run: npx --yes npm@11 publish --access public --provenance
